[package]
name = "rust_verify"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
air = { workspace = true }
bincode-next = { workspace = true }
cargo-verus-toolchains = { workspace = true }
console = { workspace = true }
getopts = { git = "https://github.com/utaal/getopts.git", branch = "parse-partial" }
hex = { workspace = true }
indexmap = { workspace = true }
indicatif = { workspace = true }
internals_interface = { workspace = true }
num-bigint = { workspace = true }
num-format = { workspace = true }
regex = { workspace = true }
rustc_mir_build_verus = { workspace = true }
rustc_hir_analysis_verus = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
sise = { workspace = true }
vir = { workspace = true }

[target.'cfg(windows)'.dependencies]
win32job = "1"

[dev-dependencies]
rust_verify_test_macros = { path = "../rust_verify_test_macros" }

[build-dependencies]
cargo-verus-toolchains = { workspace = true }

[features]
native-semantics170-inspect = ["native-resource-adapter164", "native-resource-continuation160", "vir/native-semantics170-inspect"]
native-allocator-primitive158-proposal = []
native-resource-continuation160 = ["vir/native-resource-continuation160"]
native-resource-adapter164 = ["vir/native-resource-adapter164"]
singular = ["vir/singular", "air/singular"]
experimental-native-resource = ["vir/experimental-native-resource"]

[[bin]]
name = "native-resource143"
path = "src/bin/native_resource143.rs"
required-features = ["experimental-native-resource"]

[[bin]]
name = "allocation151"
path = "src/bin/allocation151.rs"

[[bin]]
name = "primitive158"
path = "src/bin/primitive158.rs"
required-features = ["native-allocator-primitive158-proposal"]

[[bin]]
name = "continuation160"
path = "src/bin/continuation160.rs"
required-features = ["native-resource-continuation160"]

[[bin]]
name = "native-adapter164"
path = "src/bin/native_adapter164.rs"
required-features = ["native-resource-adapter164"]

[[bin]]
name = "permission154"
path = "src/bin/permission154.rs"

[[bin]]
name = "native-resource140"
path = "src/bin/native_resource140.rs"
required-features = ["experimental-native-resource"]

[package.metadata.rust-analyzer]
rustc_private = true

[lints]
workspace = true
